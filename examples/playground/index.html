<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Super Chart playground</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f7; --panel:#fff; --text:#16181d; --muted:#626a78; --line:#d9dce3; --accent:#5b45d6 }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --panel:#161b22; --text:#e6e9ef; --muted:#9aa3b2; --line:#2b3340; --accent:#a99bff } }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel) }
    header h1 { margin: 0; font-size: 16px } header span { color: var(--muted); font-size: 12px }
    main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; padding: 12px; align-items: start }
    @media (max-width: 900px) { main { grid-template-columns: 1fr } }
    aside { min-width: 0; display: grid; gap: 10px; max-height: calc(100dvh - 90px); overflow: auto; padding-right: 2px }
    @media (max-width: 900px) { aside { max-height: none } }
    fieldset { margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
    legend { padding: 0 6px; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 }
    select, input[type=text], button { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 4px 8px }
    label select, label input[type=text] { min-width: 0; max-width: 150px; flex: 0 1 150px; text-overflow: ellipsis }
    fieldset { min-width: 0 }
    button { cursor: pointer } button:hover { border-color: var(--accent) }
    .row { display: flex; flex-wrap: wrap; gap: 6px } input[type=color] { width: 40px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none }
    input[type=range] { width: 130px }
    #stage { min-width: 0 } #frame { margin: 0 auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); transition: width .15s }
    #chart { height: min(78dvh, 760px); min-height: 520px }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; font-size: 13px } .check input { margin-top: 3px }
    #status { font-size: 12px; color: var(--muted) } #errors[data-n]:not([data-n="0"]) { color: #d1242f; font-weight: 600 }
  </style>
</head>
<body>
  <header>
    <h1>Super Chart playground</h1>
    <span id="version"></span>
    <span>Runs the sources in this checkout against a synthetic feed. Nothing leaves your machine.</span>
  </header>
  <main>
    <aside id="controls"></aside>
    <section id="stage">
      <div id="frame"><div id="chart"></div></div>
      <p id="status"></p>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
