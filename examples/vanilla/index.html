<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Super Chart · web example</title>
  <style>
    body { margin: 0; font: 14px system-ui; background: #10151d; color: #d6deea }
    #chart { height: 100dvh }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    import { mountExampleChart, demonstrateApis } from './main.ts'
    const container = document.getElementById('chart')
    const { chart } = mountExampleChart(container)
    container.style.height = '100dvh'
    void demonstrateApis(chart)
  </script>
</body>
</html>
