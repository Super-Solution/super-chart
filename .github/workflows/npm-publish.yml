name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in all four packages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Super-Solution/super-chart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Verify requested release
        run: |
          node --input-type=module -e "
            import fs from 'node:fs'
            for (const dir of ['core', 'superscript', 'web', 'chat-plugin']) {
              const p = JSON.parse(fs.readFileSync('packages/' + dir + '/package.json', 'utf8'))
              if (p.version !== process.env.RELEASE_VERSION) throw new Error(p.name + ' is ' + p.version + ', not ' + process.env.RELEASE_VERSION)
            }"
      - name: Install dependencies
        # No lockfile yet: @supersolutions/super-protocol must be on npm before one can be created.
        # Replace with `npm ci` once package-lock.json is committed.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build and check packages
        run: npm run build
      - name: Publish with npm Trusted Publishing
        # Dependency order: core, then superscript and web, then the plugin.
        run: |
          for dir in core superscript web chat-plugin; do
            npm publish "./packages/$dir" --registry=https://registry.npmjs.org/ --access=public --provenance --tag=latest --ignore-scripts
          done
