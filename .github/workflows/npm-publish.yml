name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Super-Solution/super-chart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # npm provenance is unavailable for a private source repository.
      NPM_CONFIG_PROVENANCE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - name: Verify requested release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(p.name!=='@super-solution/super-chart'||p.version!==process.env.RELEASE_VERSION) throw new Error('Requested package/version does not match checkout');"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and check package consumers
        run: bun run build
      - name: Publish with npm Trusted Publishing
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          package_file=$(node -e "const fs=require('node:fs'); const [p]=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(p.filename)" "$RUNNER_TEMP/npm-pack.json")
          npm publish "./$package_file" --registry=https://registry.npmjs.org/ --access=public --tag=latest --ignore-scripts
