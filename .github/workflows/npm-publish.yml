name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in all five packages (X.Y.Z publishes to latest; X.Y.Z-next.N publishes to next)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Super-Solution/super-chart' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Verify requested release
        run: |
          node --input-type=module -e "
            import fs from 'node:fs'
            if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(-next\\.(0|[1-9]\\d*))?\$/.test(process.env.RELEASE_VERSION)) throw new Error('Unsupported release version: use X.Y.Z or X.Y.Z-next.N')
            for (const dir of ['core', 'superscript', 'bindings/web', 'bindings/react', 'integrations/chat-plugin']) {
              const p = JSON.parse(fs.readFileSync('packages/' + dir + '/package.json', 'utf8'))
              if (p.version !== process.env.RELEASE_VERSION) throw new Error(p.name + ' is ' + p.version + ', not ' + process.env.RELEASE_VERSION)
            }"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check packages
        run: npm run build
      - name: Publish with npm Trusted Publishing
        # Dependency order: core, then superscript and web, then the React binding and the plugin.
        # The tag always comes from the version, never from the manifests' publishConfig: a
        # prerelease (X.Y.Z-next.N) goes to `next` and must never reach `latest`.
        run: |
          tag="$( [[ "$RELEASE_VERSION" == *-* ]] && echo next || echo latest )"
          for dir in core superscript bindings/web bindings/react integrations/chat-plugin; do
            npm publish "./packages/$dir" --registry=https://registry.npmjs.org/ --access=public --provenance --tag="$tag" --ignore-scripts
          done
