<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>super-chart webpack bundle probe</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <script>
    // ?kc=<version>&bundle=<path>: klinecharts' UMD as the `klinecharts` global
    // (the bundle's external), then a webpack production bundle of the package.
    window.__errors = []
    window.addEventListener('error', function (e) { window.__errors.push(String(e.message)) })
    var q = new URLSearchParams(location.search)
    var kc = '/e2e/kc/' + (q.get('kc') || '9.8.12') + '/umd.js'
    function load (src, done) { var s = document.createElement('script'); s.src = src; s.onload = done; s.onerror = function () { window.__errors.push('failed to load ' + src); done() }; document.head.appendChild(s) }
    load(kc, function () {
      window.__kcOnly = window.klinecharts.getSupportedOverlays().length
      load(q.get('bundle'), function () { window.__ready = true })
    })
  </script>
</body>
</html>
