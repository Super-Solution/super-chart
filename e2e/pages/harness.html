<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>super-chart e2e harness</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; padding: 0; background: #151517; }
    #hostui { padding: 6px; color: #ccc; font: 12px sans-serif; height: 24px; box-sizing: border-box; }
    .chart { width: 1100px; height: 620px; }
  </style>
  <script>
    (function () {
      // __errors: messages (every spec asserts it is empty); __errorStacks: the
      // matching stacks, for a spec that must tell one known error from others.
      window.__errors = []
      window.__errorStacks = []
      window.addEventListener('error', function (e) { window.__errors.push(String(e.message)); window.__errorStacks.push(String(e.error && e.error.stack)) })
      window.addEventListener('unhandledrejection', function (e) { window.__errors.push(String(e.reason && e.reason.stack || e.reason)); window.__errorStacks.push(String(e.reason && e.reason.stack)) })
    })()
  </script>
</head>
<body>
  <div id="hostui">host UI: <input id="hostinput" value="host text"></div>
  <div id="charts"></div>
  <script type="module" src="./harness.js"></script>
</body>
</html>
